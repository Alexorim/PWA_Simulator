<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PWA Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Main App View -->
    <div id="mainView" class="container">
        <header class="app-header">
            <div class="logo-title">
                <span class="icon">⚡</span>
                <h1>PWA Simulator</h1>
            </div>
            <p class="subtitle">Simula y ejecuta cualquier sitio web en modo Progressive Web App</p>
        </header>

        <main class="content">
            <!-- URL Form Card -->
            <section class="card">
                <h2>Ingresa una URL</h2>
                <form id="urlForm">
                    <div class="input-group">
                        <span class="input-icon">🌐</span>
                        <input type="url" id="urlInput" placeholder="ej. twitter.com o https://github.com" required autocomplete="off">
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <span>▶</span> Abrir como PWA
                        </button>
                    </div>
                </form>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <div class="section-header">
                    <h3>Sitios Recientes</h3>
                    <button id="clearHistoryBtn" class="btn-text danger-text hidden">Limpiar todo</button>
                </div>
                <div id="historyList" class="history-list">
                    <!-- Dynamic history items populated via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Embedded In-App PWA Viewer -->
    <div id="pwaViewer" class="pwa-viewer hidden">
        <div class="viewer-header">
            <span id="viewerTitle" class="viewer-url">Cargando...</span>
            <div class="viewer-actions">
                <button id="openExternalBtn" class="btn-icon" title="Abrir en ventana independiente (PWA)">↗</button>
                <button id="closeViewerBtn" class="btn-icon" title="Cerrar">✕</button>
            </div>
        </div>
        <div id="iframeNotice" class="iframe-notice">
            <span>💡 Si la página no carga aquí (protección X-Frame del sitio),</span>
            <button id="noticeOpenBtn" class="notice-link">ábrela en ventana PWA ↗</button>
        </div>
        <iframe id="pwaIframe" src="" frameborder="0" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"></iframe>
    </div>

    <script src="js/app.js"></script>
    <script src="js/updater.js"></script>
    <script>
        // Verificar actualizaciones 2 segundos después de que la app cargue
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.PWAUpdater) {
                    window.PWAUpdater.checkForUpdates();
                }
            }, 2000);
        });
    </script>
</body>
</html>
