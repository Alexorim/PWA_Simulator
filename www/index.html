<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PWA Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Main App View -->
    <div id="mainView" class="container">
        <header class="app-header">
            <div class="logo-title">
                <span class="icon">🚀</span>
                <h1>PWA Simulator</h1>
            </div>
        </header>

        <main class="content">
            <!-- URL Form Card -->
            <section class="card">
                <h2>Abrir sitio web o PWA</h2>
                <form id="urlForm">
                    <div class="input-group">
                        <span class="input-icon">🌐</span>
                        <input type="url" id="urlInput" placeholder="ej. google.com o https://app.example.com" required autocomplete="off">
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <span>▶</span> Ejecutar como PWA
                        </button>
                    </div>
                </form>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <div class="section-header">
                    <h3>Historial Reciente</h3>
                    <button id="clearHistoryBtn" class="btn-text danger-text hidden">Limpiar todo</button>
                </div>
                <div id="historyList" class="history-list">
                    <!-- Dynamic history items populated via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Embedded In-App PWA Viewer (Fallback / Optional) -->
    <div id="pwaViewer" class="pwa-viewer hidden">
        <div class="viewer-header">
            <span id="viewerTitle" class="viewer-url">Cargando...</span>
            <button id="closeViewerBtn" class="btn-icon">✕</button>
        </div>
        <iframe id="pwaIframe" src="" frameborder="0"></iframe>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
