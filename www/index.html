<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PWA Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Neural Network Background Canvas -->
    <canvas id="neuralCanvas"></canvas>

    <!-- Main App View -->
    <div id="mainView" class="container">
        <header class="app-header">
            <div class="logo-title">
                <div class="logo-glow-wrapper">
                    <span class="icon logo-animated">⚡</span>
                </div>
                <h1>PWA Simulator</h1>
            </div>
            <p class="subtitle">Simula y ejecuta cualquier sitio web en modo Progressive Web App</p>
        </header>

        <main class="content">
            <!-- URL Form Card -->
            <section class="card">
                <h2>Ingresa una URL</h2>
                <form id="urlForm">
                    <div class="input-group">
                        <span class="input-icon">🌐</span>
                        <input type="url" id="urlInput" placeholder="ej. twitter.com o https://github.com" required autocomplete="off">
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <span>▶</span> Abrir como PWA
                        </button>
                    </div>
                </form>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <div class="section-header">
                    <h3>Sitios Recientes</h3>
                    <button id="clearHistoryBtn" class="btn-text danger-text hidden">Limpiar todo</button>
                </div>
                <div id="historyList" class="history-list">
                    <!-- Dynamic history items populated via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Embedded In-App PWA Viewer -->
    <div id="pwaViewer" class="pwa-viewer hidden">
        <div class="viewer-header">
            <span id="viewerTitle" class="viewer-url">Cargando...</span>
            <div class="viewer-actions">
                <!-- Floating / quick action menu toggle -->
                <div class="viewer-menu-wrapper">
                    <button id="viewerMenuBtn" class="btn-icon" title="Opciones rápidas">⋮</button>
                    <div id="viewerDropdown" class="viewer-dropdown hidden">
                        <button id="viewerReloadBtn" class="dropdown-item">
                            <span>🔄</span> Recargar página
                        </button>
                        <button id="viewerInstallBtn" class="dropdown-item">
                            <span>📥</span> Instalar como PWA
                        </button>
                        <button id="viewerDevtoolsBtn" class="dropdown-item">
                            <span>🛠</span> Herramientas Dev (DOM & Consola)
                        </button>
                        <button id="viewerExternalBtn" class="dropdown-item">
                            <span>↗</span> Abrir en ventana PWA
                        </button>
                        <div class="dropdown-divider"></div>
                        <button id="viewerCloseMenuBtn" class="dropdown-item danger">
                            <span>✕</span> Cerrar página
                        </button>
                    </div>
                </div>
                <button id="closeViewerBtn" class="btn-icon" title="Cerrar">✕</button>
            </div>
        </div>
        <div id="iframeNotice" class="iframe-notice">
            <span>💡 Si la página no carga aquí (protección X-Frame del sitio),</span>
            <button id="noticeOpenBtn" class="notice-link">ábrela en ventana PWA ↗</button>
        </div>
        <iframe id="pwaIframe" src="" frameborder="0" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"></iframe>

        <!-- DevTools Floating Modal / Panel -->
        <div id="devToolsModal" class="devtools-modal hidden">
            <div class="devtools-header">
                <div class="devtools-tabs">
                    <button id="tabConsole" class="tab-btn active">Consola (Logs)</button>
                    <button id="tabElements" class="tab-btn">Estructura DOM</button>
                    <button id="tabNetwork" class="tab-btn">Información PWA</button>
                </div>
                <button id="closeDevtoolsBtn" class="btn-icon">✕</button>
            </div>
            <div class="devtools-body">
                <div id="devConsoleView" class="devtools-view">
                    <div class="console-actions">
                        <button id="clearConsoleBtn" class="btn-text">Limpiar</button>
                        <span id="consoleStatus" class="status-indicator">Capturando logs...</span>
                    </div>
                    <div id="consoleOutput" class="console-output"></div>
                </div>
                <div id="devElementsView" class="devtools-view hidden">
                    <div class="elements-actions">
                        <button id="refreshDomBtn" class="btn-text">Refrescar estructura</button>
                    </div>
                    <pre id="elementsOutput" class="elements-output">Examinando DOM...</pre>
                </div>
                <div id="devNetworkView" class="devtools-view hidden">
                    <div id="pwaInfoOutput" class="pwa-info-output"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/updater.js"></script>
    <script>
        // Verificar actualizaciones 2 segundos después de que la app cargue
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.PWAUpdater) {
                    window.PWAUpdater.checkForUpdates();
                }
            }, 2000);
        });
    </script>
</body>
</html>
